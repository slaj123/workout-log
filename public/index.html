<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<meta name="description" content="Log lifts, surf, climbs and games in a few taps.">
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --chalk: #F3F0E8; --card: #FAF8F3; --ink: #1A1C19; --muted: #6B6A62; --ghost: #A8A598;
    --rule: #D9D4C7; --sea: #0E5E5A; --sea-soft: #DCE9E6; --signal: #E2552B; --signal-soft: #F7DDD2;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --tap: 48px; --nav-h: 60px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chalk: #121412; --card: #1A1D1A; --ink: #ECE8DE; --muted: #A09D92; --ghost: #66645C;
      --rule: #2E322D; --sea: #5FB3A9; --sea-soft: #173431; --signal: #F07A52; --signal-soft: #3A1E14;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--chalk); color: var(--ink);
    font: 17px/1.4 "Archivo", system-ui, sans-serif;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(var(--nav-h) + 84px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  #app { max-width: 560px; margin: 0 auto; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  input, select, textarea {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px; min-height: var(--tap);
    padding: 0 12px; width: 100%; font-size: 17px;
  }
  textarea { padding: 12px; min-height: 96px; resize: vertical; line-height: 1.4; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--sea); outline-offset: 1px; }
  select { appearance: none; -webkit-appearance: none; padding-right: 32px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 26px 0 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
  .top input[type=date] { width: auto; min-width: 150px; font-family: var(--mono); font-size: 15px; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* Horizontal chip rows (activity picker, partners, conditions). */
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
  .scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--rule);
    background: transparent; font-weight: 600; font-size: 15px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
  .chip.add { border-style: dashed; color: var(--muted); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .seg button { min-height: var(--tap); border: 0; background: transparent; font-weight: 600; border-left: 1px solid var(--rule); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--chalk); }

  /* Activity picker: big type tabs, the first thing on the log screen. */
  .types .chip { min-height: 44px; font-size: 16px; padding: 0 16px; }

  /* Stepper: [-] value [+], value is a real input so typing works too. */
  .stepper { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); align-items: center; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); min-width: 0; }
  .stepper button { height: var(--tap); border: 0; background: transparent; font: 500 24px var(--mono); color: var(--sea); }
  .stepper input { border: 0; background: transparent; text-align: center; font: 700 26px var(--mono); padding: 0; min-width: 0; min-height: var(--tap); }
  .stepper input::placeholder { color: var(--ghost); font-weight: 400; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Slider with a big mono readout. */
  .slider { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: center; }
  .slider input[type=range] { padding: 0; border: 0; background: transparent; min-height: 36px; accent-color: var(--sea); }
  .slider output { font: 700 26px var(--mono); text-align: right; }
  .slider output.unset { color: var(--ghost); font-weight: 400; }

  /* ---- The set ledger: ruled rows like a gym notebook ---- */
  .exercise { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; margin: 0 0 14px; overflow: hidden; }
  .ex-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 10px 6px; }
  .ex-head select, .ex-head input { font-weight: 600; border-color: transparent; background-color: transparent; padding-left: 4px; }
  .ex-meta { padding: 0 14px 8px; font: 13px var(--mono); color: var(--muted); }
  .ex-meta b { color: var(--ink); font-weight: 500; }
  .ledger { border-top: 1px solid var(--rule); background:
    repeating-linear-gradient(to bottom, transparent 0, transparent 51px, var(--rule) 51px, var(--rule) 52px); }
  .set { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; min-height: 52px; padding: 0 12px 0 0; border: 0; width: 100%; background: transparent; text-align: left; }
  .set .n { font: 500 13px var(--mono); color: var(--ghost); text-align: center; border-right: 1px solid var(--signal-soft); align-self: stretch; display: grid; place-items: center; }
  .set .val { font: 700 22px var(--mono); padding-left: 12px; }
  .set .val small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .set .val .tag { font: 600 11px "Archivo", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sea); margin-left: 6px; }
  .set .prev { font: 14px var(--mono); color: var(--ghost); }
  .set .prev.up { color: var(--signal); }
  .set-edit { padding: 10px 12px 12px; background: var(--chalk); border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
  .set-edit .pair .field > span { text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools .chip { min-height: 36px; font-size: 14px; padding: 0 12px; }
  .ex-foot { display: flex; gap: 8px; padding: 8px 10px 10px; border-top: 1px solid var(--rule); }
  .btn { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--rule); background: transparent; font-weight: 600; padding: 0 16px; }
  .btn.ghost { border-style: dashed; color: var(--sea); }
  .btn.small { min-height: 40px; font-size: 15px; padding: 0 12px; }
  .btn.danger { color: var(--signal); border-color: var(--signal-soft); }
  .btn.wide { width: 100%; }
  .btn.primary { background: var(--sea); border-color: var(--sea); color: #fff; }
  .x { width: 40px; height: 40px; border: 0; background: transparent; color: var(--ghost); font-size: 22px; }

  /* Cards for Watch / voice data and list items. */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; }
  .card .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sea); }
  /* Today / Tomorrow suggestion. */
  .next { border-left: 4px solid var(--sea); padding-top: 4px; }
  .next-head { display: flex; justify-content: space-between; align-items: center; margin-right: -8px; }
  .pick { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; }
  .pick + .pick { border-top: 1px solid var(--rule); }
  .pick-title { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .pick-title.alt { font-size: 17px; font-weight: 600; }
  .pick-why { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .pick-avoid { font-size: 14px; color: var(--signal); font-weight: 600; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 15px var(--mono); margin-top: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 8px; }
  .transcript { white-space: pre-wrap; font-size: 15px; margin: 8px 0 0; }
  .item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--sea-soft); color: var(--sea); display: grid; place-items: center; font: 700 13px var(--mono); }
  .item .title { font-weight: 600; }
  .item .sub { font: 14px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .when { font: 13px var(--mono); color: var(--muted); text-align: right; }
  .flag { display: inline-block; font: 600 11px "Archivo", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
  .flag.need { background: var(--signal-soft); color: var(--signal); }
  .flag.src { background: var(--sea-soft); color: var(--sea); }
  .week { font: 600 13px var(--mono); color: var(--muted); margin: 24px 0 2px; display: flex; justify-content: space-between; }

  .project { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.15); }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dots button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .dots button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--chalk); }
  .send { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .send .g { font: 700 20px var(--mono); }
  .match { display: grid; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .score { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; gap: 8px; }
  .score .vs { text-align: center; font: 700 15px var(--mono); }
  .score .vs.w { color: var(--sea); } .score .vs.l { color: var(--signal); }

  /* Sticky save bar above the bottom tabs. */
  .savebar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 10px max(16px, env(safe-area-inset-left)); background: linear-gradient(to top, var(--chalk) 70%, transparent); z-index: 4; }
  .savebar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .savebar .btn.primary { flex: 1; min-height: 52px; font-size: 18px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-top: 1px solid var(--rule); z-index: 5; }
  nav.tabs a { display: grid; place-items: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
  nav.tabs a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--sea); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 84px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--chalk); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .login { min-height: 80vh; display: grid; align-content: center; gap: 12px; max-width: 360px; margin: 0 auto; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"><p class="empty">Loading…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
